name: notification

services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

  backend:
    image: taii0401/notification-php:8.4
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis
    networks:
      - default
      - glidery-db

  worker:
    image: taii0401/notification-php:8.4
    working_dir: /var/www/html
    command: php artisan queue:work --tries=4 --timeout=90
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis
    networks:
      - default
      - glidery-db
    restart: unless-stopped

  scheduler:
    image: taii0401/notification-php:8.4
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis
    networks:
      - default
      - glidery-db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mock-receiver:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./mock-receiver:/app
    ports:
      - "127.0.0.1:9000:9000"
    profiles:
      - testing

volumes:
  backend_vendor:
  frontend-node-modules:

networks:
  glidery-db:
    external: true
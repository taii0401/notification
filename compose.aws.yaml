services:
  backend:
    image: taii0401/notification-php:8.4
    container_name: notification-backend
    working_dir: /var/www/html
    env_file:
      - ./backend/.env.aws
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on: []

  worker:
    image: taii0401/notification-php:8.4
    container_name: notification-worker
    working_dir: /var/www/html
    command: php artisan queue:work sqs --tries=4 --timeout=90
    env_file:
      - ./backend/.env.aws
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: notification-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-vendor:
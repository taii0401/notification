name: Notification CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # CI：執行 Laravel Automated Tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # GitHub Actions 測試專用 MySQL
    # Workflow 結束後這個 Container 會自動被刪除
    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: notification_test
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:

      # ----------------------------------------------------------
      # 1. Checkout Source Code
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Setup PHP
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      # ----------------------------------------------------------
      # 3. Install Composer Dependencies
      # ----------------------------------------------------------
      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      # ----------------------------------------------------------
      # 4. Prepare Laravel
      # ----------------------------------------------------------
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # ----------------------------------------------------------
      # 5. Run Automated Tests
      #
      # 注意：
      # 這裡使用 GitHub Actions 的 MySQL Container，
      # 不會連線 AWS Production RDS。
      # ----------------------------------------------------------
      - name: Run tests
        env:
          APP_ENV: testing

          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: notification_test
          DB_USERNAME: root
          DB_PASSWORD: root

          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

        run: php artisan test


  # ============================================================
  # CD：CI 成功後部署到 AWS EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # test 必須成功，才允許 deploy
    needs:
      - test

    steps:

      # ----------------------------------------------------------
      # 1. Configure SSH
      # ----------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/notification_deploy

          chmod 600 ~/.ssh/notification_deploy

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      # ----------------------------------------------------------
      # 2. Deploy to EC2
      # ----------------------------------------------------------
      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/notification_deploy \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/ec2-user/Projects/Notification && ./scripts/deploy.sh"
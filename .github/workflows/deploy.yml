name: Notification CI/CD

on:
  push:
    branches:
      - main

jobs:

  test:
  name: Run Tests
  runs-on: ubuntu-latest

  services:
    mysql:
      image: mysql:8.4

      env:
        MYSQL_DATABASE: notification_test
        MYSQL_ROOT_PASSWORD: root

      ports:
        - 3306:3306

      options: >-
        --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=10

  defaults:
    run:
      working-directory: backend

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_mysql
        coverage: none

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare Laravel
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run tests
      env:
        APP_ENV: testing

        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: notification_test
        DB_USERNAME: root
        DB_PASSWORD: root

        CACHE_STORE: array
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync

      run: php artisan test


  deploy:
    name: Deploy to EC2

    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/notification_deploy
          chmod 600 ~/.ssh/notification_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/notification_deploy \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/ec2-user/Projects/Notification && ./scripts/deploy.sh"